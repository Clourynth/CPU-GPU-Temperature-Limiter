name: Build module

# Builds the flashable module zip.
#  - When a GitHub release is published, the zip is attached to that release.
#  - Run it by hand from the Actions tab to get the zip as a downloadable build artifact.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (arm64 musl target + std sources)
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rust-src --target aarch64-unknown-linux-musl
          rustup default 1.97.0

      - name: Install the Zig linker (used to cross-link the static arm64 binary)
        run: python3 -m pip install ziglang==0.17.1

      - name: Unit tests
        run: cargo test --locked

      - name: Build the arm64 binary
        run: ./build_aarch64.sh

      - name: Package the module
        run: ./package.sh

      - name: Keep the zip as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: CPU_GPU_Temperature_Limiter_*.zip

      - name: Attach the zip to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" CPU_GPU_Temperature_Limiter_*.zip --clobber
